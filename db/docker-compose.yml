services:
  db:
    image: postgres:18-alpine
    container_name: z416-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: z416
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d z416"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: