services:
  db-dev:
    image: postgres:17-alpine
    container_name: z416-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: z416_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d z416_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-prod:
    image: postgres:17-alpine
    container_name: z416-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: prodpass
      POSTGRES_DB: z416_prod
    ports:
      - "5433:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d z416_prod"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
  pgdata_prod: